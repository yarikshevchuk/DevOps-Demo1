name: Sync with source git hub repo

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions: 
  contents: write
  pull-requests: write
  repository-projects: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch upstream and update branch
        run: |
          git remote add upstream https://github.com/Revilllo7/cinema-booking
          git fetch upstream
          git checkout -B sync/upstream upstream/main
          git push origin sync/upstream --force
      - name: Update PR
        env:
          GH_TOKEN: ${{ secrets.SYNC_DEMO1 }}
        run: |
          if ! gh api repos/${{ github.repository }}/pulls \
             -f title="Sync from upstream" \
             -f head="sync/upstream" \
             -f base="main" \
             -f body="Auto sync from upstream repo" > log.err 2>&1; then
            if grep -qi "already exists" log.err; then
              echo "PR already exists"
            elif grep -qi "No commits between" log.err; then
              echo "Nothing to sync right now"
            else
              cat log.err
              exit 1
            fi
          fi
